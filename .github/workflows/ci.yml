name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No datasets, checkpoints or oversized weights tracked
        run: python scripts/check_data_guard.py --all
      - name: Install (CPU-only torch, used by the tests as the reference)
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
